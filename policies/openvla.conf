# Registry entry for the OpenVLA-OFT policy (7B LLM-centric VLA).
# Sourced by scripts/run_eval.sh — keep it flat KEY=value, no spaces around =.
POLICY_NAME=openvla
DESCRIPTION="OpenVLA-OFT 7B (upstream adapter, LLM-centric VLA baseline)"
# Model source checkout (workspace root, created by setup.sh).
REPO_DIR=openvla
# XPolicyLab adapter dir, relative to RoboDojo/ (upstream, ships with XPolicyLab).
XPOLICYLAB_POLICY_DIR=XPolicyLab/policy/OpenVLA_OFT
# Policy env (conda) created by the adapter's install.sh (GPU box).
POLICY_ENV=openvla_oft
# Passed as --ckpt to robodojo.sh (full run-dir name under the adapter's checkpoints/).
# Default = the official merged RoboDojo checkpoint (~20 GB, no base model needed):
#   cd RoboDojo && bash scripts/RoboDojo/download_ckpt.sh huggingface OpenVLA_OFT
# Self-trained runs land at e.g. RoboDojo-cotrain-arx_x5-joint-0 (train.sh).
DEFAULT_CKPT=RoboDojo-sim-arx_x5-joint-1
ACTION_TYPE=joint
ENV_CFG=arx_x5
