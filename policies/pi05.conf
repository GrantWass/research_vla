# Registry entry for pi0.5 (Physical Intelligence pi_0.5 VLA, open-world generalization).
# Upstream model: https://github.com/Physical-Intelligence/openpi (base ckpt pi05_base).
# Served in RoboDojo via the UPSTREAM XPolicyLab adapter (no this-repo adapter needed,
# nothing to install with scripts/install_adapter.sh — it ships with XPolicyLab).
# Sourced by scripts/run_eval.sh — keep it flat KEY=value, no spaces around =.
POLICY_NAME=pi05
DESCRIPTION="pi0.5 base VLA (upstream Pi_05 adapter, uv-managed openpi env)"
# No top-level checkout: the model stack is vendored inside the adapter
# (RoboDojo/XPolicyLab/policy/Pi_05/openpi/), pinned via setup.sh's XPolicyLab pin.
REPO_DIR=
# XPolicyLab adapter dir, relative to RoboDojo/ (upstream, ships with XPolicyLab).
XPOLICYLAB_POLICY_DIR=XPolicyLab/policy/Pi_05
# NOT a conda env: Pi_05 is uv-managed (`source openpi/.venv/bin/activate` after
# `bash install.sh` in the adapter dir). run_eval.sh forwards this verbatim as
# --policy-env, and robodojo.sh accepts "conda env, uv, or env path" there.
POLICY_ENV=uv
# Passed as --ckpt to robodojo.sh. Default = the official RoboDojo checkpoint
# (seeds 0/1/2 released; seed 0 matches deploy.yml's train_config_name).
# Inference needs only params/ + assets/ (~12 GB; skip the ~30 GB train_state/):
#   see POLICIES_ROBODOJO.md "pi0.5 checkpoint (params only)".
# Self-trained runs (process_data.sh + train.sh) land at e.g.
# checkpoints/RoboDojo-cotrain-arx_x5-joint-0/.
DEFAULT_CKPT=RoboDojo-sim-arx_x5-joint-0
ACTION_TYPE=joint
ENV_CFG=arx_x5
