# Registry entry for TurboVLA (0.2B direct V+L->A VLA, 32 Hz / <1 GB VRAM on RTX 4090).
# Upstream: https://github.com/H-EmbodVis/TurboVLA (checkpoints: H-EmbodVis/TurboVLA).
# Sourced by scripts/run_eval.sh — keep it flat KEY=value, no spaces around =.
POLICY_NAME=turbovla
DESCRIPTION="TurboVLA 0.2B (this-repo adapter, direct vision+language->action)"
# Model source checkout (workspace root, created by setup.sh).
REPO_DIR=turbovla
# XPolicyLab adapter dir, relative to RoboDojo/. Owned by THIS repo
# (adapters/turbovla_robodojo/); installed via `bash scripts/install_adapter.sh turbovla`.
XPOLICYLAB_POLICY_DIR=XPolicyLab/policy/TurboVLA
# Policy env (conda) created by adapters/turbovla_robodojo/install.sh (GPU box).
POLICY_ENV=turbovla-robodojo
# Released checkpoints are LIBERO single-arm (.pth) and RoboTwin bimanual
# (.safetensors); for RoboDojo eval, train one (templates/turbovla_finetune/)
# and set CKPT to the run dir name below (the adapter resolves the EMA ckpt
# and stats JSON inside it — see adapters/turbovla_robodojo/README.md).
DEFAULT_CKPT=turbovla_robodojo_arx_x5_55k
ACTION_TYPE=joint
ENV_CFG=arx_x5
