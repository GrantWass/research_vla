name: smoke

on:
  push:
  pull_request:

jobs:
  cpu-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"  # the robot PC's Python
      - name: Install robot dependencies
        run: |
          sudo apt-get install -y --no-install-recommends libgl1 libglib2.0-0  # OpenCV runtime
          python -m pip install -r requirements/robot.txt
          # The robot tests skip without these; fail loudly instead.
          python -c "import numpy, cv2, piper_sdk"
      - name: Restore upstream checkouts
        run: bash setup.sh
      - name: Run CPU-only smoke suite
        run: python -m unittest discover -s tests -v
