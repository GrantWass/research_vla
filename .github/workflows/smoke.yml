name: smoke

on:
  push:
  pull_request:

jobs:
  cpu-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Restore upstream checkouts
        run: bash setup.sh
      - name: Run CPU-only smoke suite
        run: python3 -m unittest discover -s tests -v
